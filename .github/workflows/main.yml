name: Run Pokemon Price Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_PROD_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_PROD_CLIENT_SECRET }}
        run: python tracker.py

      - name: Save price history to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add price_history.csv

          if git diff --cached --quiet; then
            echo "No price history changes to commit."
          else
            git commit -m "Update Pokemon price history"
            git push
          fi
